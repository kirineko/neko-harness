<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light" />
		<script>
			// 首屏前应用外观偏好（与 src/client/lib/appearance.ts 的键名/属性名对拍，test/appearance.test.ts）
			(() => {
				try {
					const data = JSON.parse(localStorage.getItem("neko.appearance") || "null");
					if (!data || typeof data !== "object") return;
					const attrs = {
						theme: "data-theme",
						font: "data-chat-font",
						size: "data-chat-size",
						weight: "data-chat-weight",
						leading: "data-chat-leading",
					};
					for (const key of Object.keys(attrs)) {
						const value = data[key];
						if (typeof value === "string" && /^[a-z0-9-]{1,16}$/.test(value))
							document.documentElement.setAttribute(attrs[key], value);
					}
					const meta = document.querySelector('meta[name="color-scheme"]');
					if (data.theme === "dark" && meta) meta.setAttribute("content", "dark");
				} catch {}
			})();
		</script>
		<script>
			// 首屏前同步界面语言到 <html lang>（与 src/client/lib/language.ts 的键名对拍，test/language.test.ts）
			(() => {
				try {
					document.documentElement.setAttribute(
						"lang",
						localStorage.getItem("neko.language") === "en" ? "en" : "zh-CN",
					);
				} catch {}
			})();
		</script>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%23ffb7c5'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='bold'%3En%3C/text%3E%3C/svg%3E"
		/>
		<title>neko harness</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/client/main.tsx"></script>
	</body>
</html>
