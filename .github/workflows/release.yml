name: Release
# 推送 vX.Y.Z tag 即发版：验证（Linux/macOS/Windows + Android）全部通过后才发布 npm 并创建 GitHub Release。
# 手动运行（workflow_dispatch）是演练：只验证和构建，不发布任何东西。
# npm Trusted Publisher 绑定本文件名与 `npm` environment，二者不要改名。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'
      - id: check
        run: bun scripts/release-preflight.ts

  verify:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.x'
      - run: bun install --frozen-lockfile
      - run: bun run build:release
      # 格式与类型检查不随平台变化，只在 Linux 上跑一次。
      - if: matrix.os == 'ubuntu-26.04'
        run: bun run check
      - run: bun run test
      - run: bun run test:package
      - if: matrix.os == 'ubuntu-26.04'
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

  android-check:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # 包含读取 gateway 协议 fixtures 的 Dart 对拍测试。
      - run: flutter test

  # NekoAI Android 测试版：一次构建三个 ABI 的 release APK。
  # 暂无签名资料时 Gradle 退回 debug 签名，只用于测试安装，不同次构建的签名不一致，不能覆盖升级；
  # 后续接入 keystore（android/key.properties 由 CI secret 生成）与升级机制时在此处扩展。
  android-build:
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Gradle 首次会下载 NDK，下载偶尔损坏（"Error reading Zip content"），重试即可。
      - name: Build release APKs
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi \
              --build-name="$VERSION" \
              --build-number="$((MAJOR * 10000 + MINOR * 100 + PATCH))" && break
            [ "$attempt" = 3 ] && exit 1
            echo "build attempt $attempt failed; retrying"
            sleep 10
          done
      - name: Name the APKs
        working-directory: .
        run: |
          mkdir -p apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "apps/mobile/build/app/outputs/flutter-apk/app-$abi-release.apk" "apk/NekoAI-v$VERSION-$abi.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: apk/*.apk
          if-no-files-found: error

  # 不可逆步骤：只在所有验证都通过后才执行。
  publish:
    if: github.event_name == 'push'
    needs: [preflight, verify, android-check, android-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: npm
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts
      # Node/npm is only the registry uploader; builds/tests/runtime use Bun 1.4.x.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      # 版本已在 npm 上（例如整条流水线被重跑）时跳过，避免把已成功的发布变成失败。
      - name: Publish to npm
        run: |
          if npm view "neko-harness@$VERSION" version >/dev/null 2>&1; then
            echo "neko-harness@$VERSION is already on npm; skipping publish"
            exit 0
          fi
          npm publish ./artifacts/*.tgz --access public --tag latest --provenance

  # 可单独重跑：只依赖 artifact 与已提交的发布说明。
  github-release:
    if: github.event_name == 'push'
    needs: [preflight, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk
      - name: Create or update the GitHub Release
        run: |
          TAG="v$VERSION"
          NOTES="docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "neko-harness $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "neko-harness $VERSION" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" apk/*.apk --clobber
